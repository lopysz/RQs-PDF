<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leitor de Requisições</title>

<style>
:root{
  --bg:#f4f7f5;
  --card:#fff;
  --line:#dfe6e2;
  --text:#18221d;
  --muted:#66736c;
  --accent:#27864d;
  --accent2:#dff3e6;
  --danger:#b42318;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
}

.wrap{
  max-width:1150px;
  margin:0 auto;
  padding:24px;
}

h1{
  margin:0 0 5px;
  font-size:27px;
}

.sub{
  color:var(--muted);
  margin-bottom:20px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 2px 8px #00000008;
}

.drop{
  border:2px dashed #aebbb3;
  border-radius:12px;
  padding:32px;
  text-align:center;
  background:#fbfdfb;
  cursor:pointer;
  display:block;
}

.drop.drag{
  border-color:var(--accent);
  background:var(--accent2);
}

.drop strong{
  display:block;
  font-size:18px;
  margin-bottom:7px;
}

.drop span{
  color:var(--muted);
}

input[type=file]{
  display:none;
}

button{
  border:0;
  border-radius:9px;
  padding:10px 15px;
  background:var(--accent);
  color:white;
  font-weight:700;
  cursor:pointer;
}

button.secondary{
  background:#e8eee9;
  color:#24332a;
}

.row{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}

.progress{
  height:10px;
  background:#e7ece9;
  border-radius:99px;
  overflow:hidden;
  margin-top:12px;
}

.bar{
  height:100%;
  width:0;
  background:var(--accent);
  transition:.2s;
}

.status{
  margin-top:9px;
  color:var(--muted);
  font-size:14px;
  min-height:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.field{
  background:#f7f9f7;
  border:1px solid var(--line);
  border-radius:9px;
  padding:10px;
}

.label{
  font-size:11px;
  color:var(--muted);
  text-transform:uppercase;
}

.value{
  font-weight:700;
  margin-top:4px;
  word-break:break-word;
}

.tablewrap{
  overflow:auto;
  border:1px solid var(--line);
  border-radius:10px;
}

table{
  border-collapse:collapse;
  width:100%;
  min-width:900px;
}

th,td{
  padding:9px 10px;
  border-bottom:1px solid var(--line);
  text-align:left;
  font-size:14px;
}

th{
  background:#eef4ef;
  font-size:12px;
  text-transform:uppercase;
  color:#516058;
}

tr:last-child td{
  border-bottom:0;
}

pre{
  white-space:pre-wrap;
  word-break:break-word;
  background:#101512;
  color:#d8e8dd;
  border-radius:10px;
  padding:14px;
  max-height:380px;
  overflow:auto;
  font-size:12px;
}

.hidden{
  display:none;
}

.error{
  color:var(--danger);
  font-weight:700;
}

.small{
  font-size:12px;
  color:var(--muted);
}

@media(max-width:700px){
  .wrap{
    padding:12px;
  }

  .grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <h1>Leitor de Requisições</h1>

  <div class="sub">
    OCR por coordenadas para preservar código, item, quantidade e colaborador.
  </div>

  <div class="card">

    <label class="drop" id="drop">

      <strong>
        Selecione ou arraste uma requisição PDF
      </strong>

      <span>
        O processamento acontece no navegador.
      </span>

      <input
        id="file"
        type="file"
        accept=".pdf,application/pdf"
      >

    </label>

    <div class="progress">
      <div class="bar" id="bar"></div>
    </div>

    <div class="status" id="status">
      Aguardando PDF.
    </div>

  </div>


  <div class="card hidden" id="actions">

    <div class="row">

      <button id="copy">
        Copiar JSON
      </button>

      <button class="secondary" id="csv">
        Exportar CSV
      </button>

      <button class="secondary" id="toggleRaw">
        Mostrar OCR bruto
      </button>

    </div>

  </div>


  <div class="card hidden" id="result">

    <h2>Resultado</h2>

    <div class="grid" id="meta"></div>

    <h3>Itens</h3>

    <div class="tablewrap">

      <table>

        <thead>

          <tr>
            <th>Código</th>
            <th>Item</th>
            <th>Tamanho</th>
            <th>Solicitado</th>
            <th>Aprovado</th>
            <th>Colaborador</th>
          </tr>

        </thead>

        <tbody id="tbody"></tbody>

      </table>

    </div>

    <p class="small" id="info"></p>

  </div>


  <div class="card hidden" id="rawCard">

    <h3>OCR bruto / diagnóstico</h3>

    <pre id="raw"></pre>

  </div>

</div>


<script type="module">

/* =========================================================
   BIBLIOTECAS
========================================================= */

import * as pdfjsLib from
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";


const Tesseract =
await import(
  "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.esm.min.js"
);


/* =========================================================
   ELEMENTOS
========================================================= */

const $ = id => document.getElementById(id);

const drop = $("drop");
const fileInput = $("file");
const bar = $("bar");
const status = $("status");

const resultBox = $("result");
const actions = $("actions");
const rawCard = $("rawCard");


let finalData = null;
let rawDiagnostic = "";


/* =========================================================
   UPLOAD
========================================================= */

drop.addEventListener("click", e => {

  if(e.target !== fileInput){
    fileInput.click();
  }

});


fileInput.addEventListener("change", e => {

  if(e.target.files[0]){
    processPDF(e.target.files[0]);
  }

});


["dragenter","dragover"].forEach(ev => {

  drop.addEventListener(ev,e => {

    e.preventDefault();

    drop.classList.add("drag");

  });

});


["dragleave","drop"].forEach(ev => {

  drop.addEventListener(ev,e => {

    e.preventDefault();

    drop.classList.remove("drag");

  });

});


drop.addEventListener("drop",e => {

  const f = e.dataTransfer.files[0];

  if(
    f &&
    (
      f.type === "application/pdf" ||
      /\.pdf$/i.test(f.name)
    )
  ){

    processPDF(f);

  }

});


/* =========================================================
   PROGRESSO
========================================================= */

function setProgress(p,msg){

  bar.style.width =
    Math.max(0,Math.min(100,p)) + "%";

  status.textContent = msg;

}


/* =========================================================
   NORMALIZAÇÃO
========================================================= */

function norm(s){

  return (s || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toUpperCase()
    .trim();

}


function clean(s){

  return (s || "")
    .replace(/\s+/g," ")
    .trim();

}


function numFromText(s){

  const m = String(s || "").match(/\d+/);

  return m
    ? parseInt(m[0],10)
    : null;

}


function looksLikeCode(s){

  const x = String(s || "")
    .replace(/\s/g,"");

  return /^\d{6,12}$/.test(x);

}


/* =========================================================
   TRANSFORMA WORDS EM LINHAS
========================================================= */

function wordsLine(words){

  if(!words.length){
    return [];
  }

  const sorted = [...words]
    .sort((a,b) =>
      a.cy - b.cy ||
      a.x0 - b.x0
    );

  const lines = [];


  for(const w of sorted){

    let line = lines.find(l =>
      Math.abs(l.cy - w.cy)
      <= Math.max(l.avgH * 0.55,8)
    );


    if(!line){

      line = {
        cy:w.cy,
        avgH:w.h,
        words:[]
      };

      lines.push(line);

    }


    line.words.push(w);

    line.avgH =
      (line.avgH + w.h) / 2;

    line.cy =
      line.words.reduce(
        (a,z)=>a+z.cy,
        0
      ) / line.words.length;

  }


  for(const l of lines){

    l.words.sort(
      (a,b)=>a.x0-b.x0
    );

  }


  return lines.sort(
    (a,b)=>a.cy-b.cy
  );

}


function lineText(line){

  return clean(
    line.words
      .map(w=>w.text)
      .join(" ")
  );

}


/* =========================================================
   DESCOBRIR POSIÇÃO DAS COLUNAS
========================================================= */

function findHeaderX(lines,candidates){

  for(const line of lines){

    for(const w of line.words){

      const n = norm(w.text);

      if(
        candidates.some(c =>
          n === c ||
          n.includes(c) ||
          c.includes(n)
        )
      ){

        return w.x0 + w.w / 2;

      }

    }

  }

  return null;

}


/* =========================================================
   WORD MAIS PRÓXIMA DE UMA COLUNA
========================================================= */

function nearestWord(words,x,y,maxY=30){

  let best = null;
  let bestDistance = Infinity;


  for(const w of words){

    const center =
      w.x0 + w.w / 2;

    const distance =
      Math.abs(center-x) +
      Math.abs(w.cy-y)*1.8;


    if(
      Math.abs(w.cy-y) <= maxY &&
      distance < bestDistance
    ){

      best = w;
      bestDistance = distance;

    }

  }


  return best;

}


/* =========================================================
   PARSE DA PÁGINA
========================================================= */

function parsePage(pageWords,pageNo){

  const lines =
    wordsLine(pageWords);

  const allText =
    lines.map(lineText).join("\n");

  const nt = norm(allText);


  /* -----------------------------------------------
     DETECTA PÁGINA DE RESUMO
  ------------------------------------------------ */

  if(
    nt.includes("QUADRO DE RESUMO") ||
    nt.includes("RESUMO TOTAL") ||
    nt.includes("TOTAL DE ITENS APROVADOS")
  ){

    return {
      type:"summary",
      text:allText,
      items:[]
    };

  }


  /* -----------------------------------------------
     ENCONTRA AS COLUNAS
  ------------------------------------------------ */

  const header = {

    code:
      findHeaderX(
        lines,
        ["CODIGO","COD"]
      ),

    item:
      findHeaderX(
        lines,
        ["ITEM","DESCRICAO","PRODUTO","MATERIAL"]
      ),

    requested:
      findHeaderX(
        lines,
        ["SOLICITADO","SOLICIT"]
      ),

    approved:
      findHeaderX(
        lines,
        ["APROVADO","APROV"]
      ),

    collaborator:
      findHeaderX(
        lines,
        ["COLABORADOR"]
      )

  };


  /* -----------------------------------------------
     FALLBACK DE POSIÇÕES
  ------------------------------------------------ */

  const xs =
    pageWords.map(
      w => w.x0 + w.w/2
    );


  const minX =
    Math.min(...xs);

  const maxX =
    Math.max(...xs);


  if(header.code == null){
    header.code =
      minX + (maxX-minX)*0.06;
  }


  if(header.item == null){
    header.item =
      minX + (maxX-minX)*0.25;
  }


  if(header.requested == null){
    header.requested =
      minX + (maxX-minX)*0.78;
  }


  if(header.approved == null){
    header.approved =
      minX + (maxX-minX)*0.88;
  }


  /* -----------------------------------------------
     LOCALIZA CÓDIGOS
  ------------------------------------------------ */

  const codeWords =
    pageWords.filter(
      w => looksLikeCode(w.text)
    );


  const rows = [];


  for(const cw of codeWords){

    const y = cw.cy;


    /* evita detectar o mesmo código duas vezes */

    if(
      rows.some(
        r =>
          Math.abs(r.y-y) < 15
      )
    ){
      continue;
    }


    const near =
      pageWords.filter(
        w =>
          Math.abs(w.cy-y)
          <= Math.max(18,cw.h*.9)
      );


    const ordered =
      near.sort(
        (a,b)=>a.x0-b.x0
      );


    /* ---------------------------------------------
       SOLICITADO
    --------------------------------------------- */

    const req =
      nearestWord(
        near,
        header.requested,
        y,
        24
      );


    /* ---------------------------------------------
       APROVADO
    --------------------------------------------- */

    const app =
      nearestWord(
        near,
        header.approved,
        y,
        24
      );


    /* ---------------------------------------------
       DESCRIÇÃO
    --------------------------------------------- */

    const codeRight =
      cw.x0 + cw.w;


    const rightLimit =
      header.requested != null
        ? header.requested - 20
        : maxX*.72;


    let descWords =
      ordered.filter(
        w =>
          w.x0 > codeRight+3 &&
          w.x0+w.w < rightLimit &&
          !looksLikeCode(w.text)
      );


    /* ---------------------------------------------
       TAMANHO
    --------------------------------------------- */

    const sizeCandidates =
      descWords.filter(
        w =>
          /^\(?\d{1,3}\)?$/.test(w.text)
      );


    let size = "";
    let itemWords = descWords;


    if(sizeCandidates.length){

      const sz =
        sizeCandidates[
          sizeCandidates.length-1
        ];


      size =
        sz.text.replace(/[()]/g,"");


      itemWords =
        descWords.filter(
          w => w !== sz
        );

    }


    const item =
      clean(
        itemWords
          .map(w=>w.text)
          .join(" ")
      )
      .replace(
        /^[-:|]+|[-:|]+$/g,
        ""
      );


    /* ---------------------------------------------
       COLABORADOR
    --------------------------------------------- */

    let collaborator = "";


    const idx =
      lines.findIndex(
        l => l.words.includes(cw)
      );


    if(idx >= 0){

      for(
        let j=idx;
        j<Math.min(lines.length,idx+5);
        j++
      ){

        const lt =
          norm(lineText(lines[j]));


        if(
          lt.includes("COLABORADOR")
        ){

          const same =
            lineText(lines[j])
              .replace(
                /.*COLABORADOR\s*:?\s*/i,
                ""
              )
              .trim();


          if(same){

            collaborator = same;

          }else if(lines[j+1]){

            collaborator =
              lineText(lines[j+1]);

          }


          break;

        }

      }

    }


    rows.push({

      code:
        cw.text.replace(/\s/g,""),

      item,

      size,

      requested:
        numFromText(req?.text) ?? 0,

      approved:
        numFromText(app?.text) ?? 0,

      collaborator,

      y

    });

  }


  /* -----------------------------------------------
     FALLBACK PARA COLABORADORES
  ------------------------------------------------ */

  if(
    rows.some(r => !r.collaborator)
  ){

    const collBlocks = [];


    lines.forEach((l,i)=>{

      const n =
        norm(lineText(l));


      if(
        n.includes("COLABORADOR")
      ){

        let name =
          lineText(l)
            .replace(
              /.*COLABORADOR\s*:?\s*/i,
              ""
            )
            .trim();


        if(
          !name &&
          lines[i+1]
        ){

          name =
            lineText(lines[i+1]);

        }


        if(name){

          collBlocks.push({
            y:l.cy,
            name
          });

        }

      }

    });


    for(const r of rows){

      if(!r.collaborator){

        const candidates =
          collBlocks
            .filter(c=>c.y>=r.y-5)
            .sort(
              (a,b)=>a.y-b.y
            );


        if(candidates.length){

          r.collaborator =
            candidates[0].name;

        }

      }

    }

  }


  /* -----------------------------------------------
     LIMPA FALSOS POSITIVOS
  ------------------------------------------------ */

  const cleanRows = [];


  for(const r of rows){

    if(!r.code || r.code.length < 6){
      continue;
    }


    if(
      /^(000000|111111|999999)$/.test(r.code)
    ){
      continue;
    }


    if(
      cleanRows.some(
        x =>
          x.code === r.code &&
          Math.abs(x.y-r.y)<15
      )
    ){
      continue;
    }


    cleanRows.push(r);

  }


  return {

    type:"items",

    text:allText,

    items:cleanRows,

    header

  };

}


/* =========================================================
   OCR
========================================================= */

async function ocrCanvas(canvas,pageNo,total){

  const worker =
    await Tesseract.createWorker(
      "por",
      1,
      {
        logger:m=>{

          if(
            m.status === "recognizing text"
          ){

            const p =
              (m.progress || 0)*100;


            setProgress(
              (
                (pageNo-1) +
                p/100
              ) / total * 100,

              `OCR da página ${pageNo}/${total}: ${p.toFixed(0)}%`
            );

          }

        }
      }
    );


  await worker.setParameters({

    tessedit_pageseg_mode:"6",

    preserve_interword_spaces:"1"

  });


  const {data} =
    await worker.recognize(canvas);


  await worker.terminate();


  const words =
    (data.words || [])
      .map(w=>({

        text:w.text,

        x0:w.bbox.x0,

        x1:w.bbox.x1,

        y0:w.bbox.y0,

        y1:w.bbox.y1,

        w:
          w.bbox.x1 -
          w.bbox.x0,

        h:
          w.bbox.y1 -
          w.bbox.y0,

        cy:
          (
            w.bbox.y0 +
            w.bbox.y1
          ) / 2

      }))
      .filter(
        w => w.text.trim()
      );


  return {
    data,
    words
  };

}


/* =========================================================
   PRÉ-PROCESSAMENTO DA IMAGEM
========================================================= */

function preprocess(src){

  const c =
    document.createElement("canvas");

  c.width = src.width;
  c.height = src.height;


  const ctx =
    c.getContext(
      "2d",
      {
        willReadFrequently:true
      }
    );


  ctx.drawImage(src,0,0);


  const im =
    ctx.getImageData(
      0,
      0,
      c.width,
      c.height
    );


  const d = im.data;


  for(
    let i=0;
    i<d.length;
    i+=4
  ){

    const g =
      0.299*d[i] +
      0.587*d[i+1] +
      0.114*d[i+2];


    let v =
      (g-128)*1.45 + 128;


    v =
      Math.max(
        0,
        Math.min(255,v)
      );


    d[i] =
      d[i+1] =
      d[i+2] =
      v;

  }


  ctx.putImageData(im,0,0);

  return c;

}


/* =========================================================
   METADADOS
========================================================= */

function extractMeta(allText){

  const t =
    allText.replace(/\r/g,"");


  const get = patterns => {

    for(const p of patterns){

      const m =
        t.match(p);


      if(m){

        return clean(m[1]);

      }

    }

    return "";

  };


  return {

    solicitante:
      get([
        /SOLICITANTE\s*:?\s*([^\n]+)/i
      ]),


    contrato:
      get([
        /CONTRATO\s*\/\s*UNIDADE\s*:?\s*([^\n]+)/i,
        /CONTRATO\s*:?\s*([^\n]+)/i
      ]),


    requisicao:
      get([
        /N[ÚU]MERO\s+REQUISI[CÇ][AÃ]O\s*:?\s*(RQ[-\s]?\d+)/i,
        /\b(RQ[-\s]?\d{3,})\b/i
      ])

  };

}


/* =========================================================
   CONSOLIDAÇÃO
========================================================= */

function consolidate(items){

  /*
    Mantemos uma linha por colaborador.

    Isso é importante porque:

    00801856 - Elaine
    00801856 - Lucia

    são duas retiradas diferentes.

    O resumo da segunda página não entra aqui.
  */

  return items.map(r => ({

    codigo:r.code,

    nome:r.item,

    tamanho:r.size,

    solicitado:r.requested,

    aprovado:r.approved,

    colaborador:r.collaborator

  }));

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(s){

  return String(s ?? "")
    .replace(
      /[&<>"']/g,
      m => ({

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"

      }[m])
    );

}


/* =========================================================
   MOSTRAR RESULTADO
========================================================= */

function render(data){

  finalData = data;


  $("meta").innerHTML = "";


  [
    ["Solicitante",data.solicitante],
    ["Contrato / Unidade",data.contrato],
    ["Requisição",data.requisicao]
  ]
  .forEach(([k,v])=>{

    $("meta").insertAdjacentHTML(
      "beforeend",

      `
      <div class="field">

        <div class="label">
          ${escapeHtml(k)}
        </div>

        <div class="value">
          ${escapeHtml(v || "Não identificado")}
        </div>

      </div>
      `
    );

  });


  $("tbody").innerHTML = "";


  data.itens.forEach(r=>{

    $("tbody").insertAdjacentHTML(
      "beforeend",

      `
      <tr>

        <td>
          ${escapeHtml(r.codigo)}
        </td>

        <td>
          ${escapeHtml(r.nome)}
        </td>

        <td>
          ${escapeHtml(r.tamanho)}
        </td>

        <td>
          ${r.solicitado}
        </td>

        <td>
          ${r.aprovado}
        </td>

        <td>
          ${escapeHtml(r.colaborador)}
        </td>

      </tr>
      `
    );

  });


  $("info").textContent =
    `${data.itens.length} item(ns) individual(is) identificado(s). ` +
    `A página de resumo foi ignorada.`;


  resultBox.classList.remove("hidden");

  actions.classList.remove("hidden");

}


/* =========================================================
   PROCESSAR PDF
========================================================= */

async function processPDF(file){

  if(
    !file ||
    (
      !/pdf$/i.test(file.type) &&
      !/\.pdf$/i.test(file.name)
    )
  ){

    status.innerHTML =
      '<span class="error">Selecione um PDF.</span>';

    return;

  }


  resultBox.classList.add("hidden");
  actions.classList.add("hidden");
  rawCard.classList.add("hidden");


  rawDiagnostic = "";


  setProgress(
    2,
    "Abrindo PDF..."
  );


  try{

    const buf =
      await file.arrayBuffer();


    const pdf =
      await pdfjsLib
        .getDocument({
          data:buf
        })
        .promise;


    const pages = [];


    /* ---------------------------------------------
       RENDERIZA TODAS AS PÁGINAS
    --------------------------------------------- */

    for(
      let i=1;
      i<=pdf.numPages;
      i++
    ){

      setProgress(
        (i-1)/pdf.numPages*12,
        `Renderizando página ${i}/${pdf.numPages}...`
      );


      const page =
        await pdf.getPage(i);


      const viewport =
        page.getViewport({
          scale:2.6
        });


      const c =
        document.createElement("canvas");


      c.width =
        Math.ceil(viewport.width);


      c.height =
        Math.ceil(viewport.height);


      await page.render({

        canvasContext:
          c.getContext("2d"),

        viewport

      }).promise;


      pages.push(
        preprocess(c)
      );

    }


    const pageResults = [];


    /* ---------------------------------------------
       OCR
    --------------------------------------------- */

    for(
      let i=0;
      i<pages.length;
      i++
    ){

      const {
        data,
        words
      } =
        await ocrCanvas(
          pages[i],
          i+1,
          pages.length
        );


      const parsed =
        parsePage(
          words,
          i+1
        );


      pageResults.push(parsed);


      rawDiagnostic +=
        `\n===== PÁGINA ${i+1} =====\n` +
        `${data.text || parsed.text}\n`;

    }


    /* ---------------------------------------------
       META
    --------------------------------------------- */

    setProgress(
      96,
      "Organizando campos e itens..."
    );


    const allText =
      pageResults
        .map(p=>p.text)
        .join("\n");


    const meta =
      extractMeta(allText);


    /* ---------------------------------------------
       SÓ PÁGINAS DE ITENS
    --------------------------------------------- */

    const itemPages =
      pageResults.filter(
        p => p.type === "items"
      );


    let items =
      itemPages.flatMap(
        p => p.items
      );


    items =
      consolidate(items);


    const data = {

      ...meta,

      itens:items

    };


    /* ---------------------------------------------
       DIAGNÓSTICO
    --------------------------------------------- */

    rawDiagnostic +=
      "\n===== DIAGNÓSTICO DE PÁGINAS =====\n" +
      pageResults
        .map(
          (p,i) =>
            `Página ${i+1}: ${p.type}; itens=${p.items.length}`
        )
        .join("\n");


    render(data);


    $("raw").textContent =
      rawDiagnostic;


    setProgress(
      100,
      `Concluído: ${items.length} item(ns) identificado(s) em ${pdf.numPages} página(s).`
    );


  }catch(err){

    console.error(err);


    status.innerHTML =
      `<span class="error">
        Erro: ${escapeHtml(err.message || err)}
      </span>`;

  }

}


/* =========================================================
   COPIAR JSON
========================================================= */

$("copy").onclick =
async () => {

  if(!finalData){
    return;
  }


  await navigator.clipboard.writeText(
    JSON.stringify(
      finalData,
      null,
      2
    )
  );


  status.textContent =
    "JSON copiado.";

};


/* =========================================================
   CSV
========================================================= */

$("csv").onclick = () => {

  if(!finalData){
    return;
  }


  const head = [

    "codigo",
    "nome",
    "tamanho",
    "solicitado",
    "aprovado",
    "colaborador"

  ];


  const esc = v =>
    `"${String(v ?? "").replace(/"/g,'""')}"`;


  const lines = [

    head.join(";"),

    ...finalData.itens.map(
      r =>
        head
          .map(k=>esc(r[k]))
          .join(";")
    )

  ];


  const blob =
    new Blob(
      [
        "\ufeff" +
        lines.join("\n")
      ],
      {
        type:
          "text/csv;charset=utf-8"
      }
    );


  const a =
    document.createElement("a");


  a.href =
    URL.createObjectURL(blob);


  a.download =
    (
      finalData.requisicao ||
      "requisicao"
    ) + ".csv";


  a.click();


  URL.revokeObjectURL(a.href);

};

   OCR BRUTO
========================================================= */

  rawCard.classList.toggle("hidden");

};
