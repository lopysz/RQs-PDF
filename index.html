<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Leitor de Requisições</title>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
        type="module"></script>

<!-- Tesseract -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f4f7f5;
    color: #202124;
    font-family: Arial, Helvetica, sans-serif;
}

header {
    background: #198754;
    color: white;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
}

header h1 {
    margin: 0;
    font-size: 23px;
}

header p {
    margin: 6px 0 0;
    font-size: 14px;
    opacity: .9;
}

.container {
    width: min(1200px, 95%);
    margin: 22px auto;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 2px 10px rgba(0,0,0,.07);
}

h2 {
    margin-top: 0;
    font-size: 19px;
}

.drop-zone {
    border: 2px dashed #198754;
    border-radius: 12px;
    min-height: 190px;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    cursor: pointer;
    background: #f8fffb;
    transition: .2s;
}

.drop-zone:hover,
.drop-zone.dragover {
    background: #e9f7ef;
    border-color: #146c43;
}

.drop-zone strong {
    display: block;
    font-size: 18px;
    margin-bottom: 8px;
}

.drop-zone span {
    color: #6c757d;
    font-size: 14px;
}

input[type="file"] {
    display: none;
}

.buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 15px;
}

button {
    border: 0;
    border-radius: 7px;
    padding: 11px 18px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.btn-green {
    background: #198754;
    color: white;
}

.btn-green:hover:not(:disabled) {
    background: #157347;
}

.btn-gray {
    background: #e9ecef;
    color: #212529;
}

.btn-red {
    background: #dc3545;
    color: white;
}

.status {
    margin-top: 15px;
    padding: 11px 13px;
    border-radius: 7px;
    background: #f1f3f5;
    font-size: 14px;
}

.status.ok {
    background: #d1e7dd;
    color: #0f5132;
}

.status.error {
    background: #f8d7da;
    color: #842029;
}

.status.warning {
    background: #fff3cd;
    color: #664d03;
}

.progress {
    margin-top: 12px;
    width: 100%;
    height: 12px;
    background: #e9ecef;
    border-radius: 20px;
    overflow: hidden;
}

.progress-bar {
    width: 0%;
    height: 100%;
    background: #198754;
    transition: width .2s;
}

.progress-text {
    margin-top: 6px;
    font-size: 13px;
    color: #6c757d;
}

.result-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 18px;
}

.result-box {
    border: 1px solid #dee2e6;
    background: #f8f9fa;
    padding: 13px;
    border-radius: 8px;
}

.result-box small {
    display: block;
    color: #6c757d;
    margin-bottom: 5px;
}

.result-box strong {
    font-size: 15px;
}

.table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: #198754;
    color: white;
    padding: 10px;
    text-align: left;
    white-space: nowrap;
}

td {
    padding: 9px;
    border-bottom: 1px solid #dee2e6;
}

tr:hover td {
    background: #f8f9fa;
}

.empty {
    text-align: center;
    color: #6c757d;
    padding: 35px 10px;
}

textarea {
    width: 100%;
    min-height: 280px;
    resize: vertical;
    font-family: monospace;
    font-size: 12px;
    padding: 12px;
    border: 1px solid #ced4da;
    border-radius: 7px;
}

.raw {
    display: none;
    margin-top: 15px;
}

.file-info {
    margin-top: 12px;
    font-size: 13px;
    color: #6c757d;
}

.page-preview {
    display: none;
    margin-top: 15px;
}

.page-preview canvas {
    max-width: 100%;
    border: 1px solid #ddd;
    border-radius: 6px;
}

@media (max-width: 750px) {
    .result-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>Leitor de Requisições</h1>
    <p>Leitura de PDF por OCR</p>
</header>

<div class="container">

    <!-- UPLOAD -->
    <div class="card">

        <h2>1. Selecionar requisição</h2>

        <label class="drop-zone" id="dropZone">

            <div>
                <strong>Arraste o PDF aqui</strong>
                <span>ou clique para selecionar o arquivo</span>
            </div>

            <input
                type="file"
                id="fileInput"
                accept=".pdf,application/pdf"
            >

        </label>

        <div
            id="fileInfo"
            class="file-info"
        >
            Nenhum arquivo selecionado.
        </div>

        <div class="buttons">

            <button
                id="btnLer"
                class="btn-green"
                disabled
            >
                Ler requisição
            </button>

            <button
                id="btnLimpar"
                class="btn-gray"
            >
                Limpar
            </button>

        </div>

        <div
            id="status"
            class="status"
        >
            Selecione um PDF para começar.
        </div>

        <div class="progress">
            <div
                id="progressBar"
                class="progress-bar"
            ></div>
        </div>

        <div
            id="progressText"
            class="progress-text"
        >
            Aguardando arquivo.
        </div>

    </div>


    <!-- RESULTADO -->
    <div class="card">

        <h2>2. Resultado</h2>

        <div id="resultado">

            <div class="empty">
                Nenhuma requisição processada.
            </div>

        </div>

        <div class="buttons">

            <button
                id="btnCopiar"
                class="btn-green"
                disabled
            >
                Copiar resultado
            </button>

            <button
                id="btnCSV"
                class="btn-gray"
                disabled
            >
                Exportar CSV
            </button>

            <button
                id="btnTexto"
                class="btn-gray"
                disabled
            >
                Mostrar texto OCR
            </button>

        </div>

        <div
            id="rawArea"
            class="raw"
        >

            <h3>Texto reconhecido pelo OCR</h3>

            <textarea
                id="rawText"
                readonly
            ></textarea>

        </div>

    </div>

</div>


<script type="module">

/*
============================================================
PDF.JS
============================================================
*/

import * as pdfjsLib from
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";


/*
============================================================
ELEMENTOS
============================================================
*/

const fileInput =
document.getElementById("fileInput");

const dropZone =
document.getElementById("dropZone");

const fileInfo =
document.getElementById("fileInfo");

const btnLer =
document.getElementById("btnLer");

const btnLimpar =
document.getElementById("btnLimpar");

const statusBox =
document.getElementById("status");

const progressBar =
document.getElementById("progressBar");

const progressText =
document.getElementById("progressText");

const resultado =
document.getElementById("resultado");

const btnCopiar =
document.getElementById("btnCopiar");

const btnCSV =
document.getElementById("btnCSV");

const btnTexto =
document.getElementById("btnTexto");

const rawArea =
document.getElementById("rawArea");

const rawText =
document.getElementById("rawText");


let arquivoSelecionado = null;
let resultadoAtual = null;


/*
============================================================
STATUS
============================================================
*/

function setStatus(texto, tipo = "") {

    statusBox.textContent = texto;

    statusBox.className = "status";

    if (tipo) {
        statusBox.classList.add(tipo);
    }
}


/*
============================================================
PROGRESSO
============================================================
*/

function setProgress(valor, texto) {

    valor = Math.max(
        0,
        Math.min(100, valor)
    );

    progressBar.style.width =
        valor + "%";

    progressText.textContent =
        texto;
}


/*
============================================================
SELEÇÃO DO ARQUIVO
============================================================
*/

dropZone.addEventListener(
    "click",
    () => fileInput.click()
);


fileInput.addEventListener(
    "change",
    () => {

        if (fileInput.files.length) {

            selecionarArquivo(
                fileInput.files[0]
            );

        }

    }
);


dropZone.addEventListener(
    "dragover",
    event => {

        event.preventDefault();

        dropZone.classList.add(
            "dragover"
        );

    }
);


dropZone.addEventListener(
    "dragleave",
    () => {

        dropZone.classList.remove(
            "dragover"
        );

    }
);


dropZone.addEventListener(
    "drop",
    event => {

        event.preventDefault();

        dropZone.classList.remove(
            "dragover"
        );

        const files =
            event.dataTransfer.files;

        if (files.length) {

            selecionarArquivo(
                files[0]
            );

        }

    }
);


/*
============================================================
SELECIONAR ARQUIVO
============================================================
*/

function selecionarArquivo(file) {

    if (
        file.type !== "application/pdf" &&
        !file.name.toLowerCase().endsWith(".pdf")
    ) {

        setStatus(
            "Selecione um arquivo PDF.",
            "error"
        );

        return;
    }


    arquivoSelecionado = file;

    fileInfo.textContent =
        `Arquivo: ${file.name} — ` +
        `${formatarTamanho(file.size)}`;

    btnLer.disabled = false;

    setStatus(
        "PDF pronto para leitura.",
        "ok"
    );

    setProgress(
        0,
        "Aguardando início do OCR."
    );
}


/*
============================================================
TAMANHO
============================================================
*/

function formatarTamanho(bytes) {

    if (bytes < 1024) {

        return bytes + " B";

    }

    if (bytes < 1024 * 1024) {

        return (
            bytes / 1024
        ).toFixed(1) + " KB";

    }

    return (
        bytes / (1024 * 1024)
    ).toFixed(1) + " MB";
}


/*
============================================================
LER PDF
============================================================
*/

btnLer.addEventListener(
    "click",
    lerPDF
);


async function lerPDF() {

    if (!arquivoSelecionado) {

        setStatus(
            "Selecione um PDF primeiro.",
            "error"
        );

        return;
    }


    btnLer.disabled = true;
    btnCopiar.disabled = true;
    btnCSV.disabled = true;
    btnTexto.disabled = true;


    resultadoAtual = null;


    resultado.innerHTML = `
        <div class="empty">
            Processando PDF...
        </div>
    `;


    rawText.value = "";
    rawArea.style.display = "none";


    try {

        setStatus(
            "Abrindo PDF...",
            ""
        );


        setProgress(
            2,
            "Abrindo PDF..."
        );


        const buffer =
            await arquivoSelecionado.arrayBuffer();


        const pdf =
            await pdfjsLib.getDocument({
                data: buffer
            }).promise;


        const totalPaginas =
            pdf.numPages;


        if (!totalPaginas) {

            throw new Error(
                "O PDF não possui páginas."
            );

        }


        setStatus(
            `PDF aberto. ${totalPaginas} página(s) encontrada(s).`,
            "ok"
        );


        let textoCompleto = "";


        /*
        --------------------------------------------------------
        PROCESSAR CADA PÁGINA
        --------------------------------------------------------
        */

        for (
            let paginaNumero = 1;
            paginaNumero <= totalPaginas;
            paginaNumero++
        ) {

            const porcentagemBase =
                ((paginaNumero - 1) /
                totalPaginas) * 100;


            setProgress(
                porcentagemBase,
                `Preparando página ${paginaNumero} de ${totalPaginas}...`
            );


            const pagina =
                await pdf.getPage(
                    paginaNumero
                );


            /*
            ----------------------------------------------------
            ESCALA ALTA
            ----------------------------------------------------
            */

            const viewport =
                pagina.getViewport({
                    scale: 2.5
                });


            const canvas =
                document.createElement("canvas");


            const contexto =
                canvas.getContext(
                    "2d",
                    {
                        willReadFrequently: true
                    }
                );


            canvas.width =
                Math.ceil(
                    viewport.width
                );

            canvas.height =
                Math.ceil(
                    viewport.height
                );


            /*
            ----------------------------------------------------
            FUNDO BRANCO
            ----------------------------------------------------
            */

            contexto.fillStyle =
                "#ffffff";

            contexto.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            await pagina.render({
                canvasContext: contexto,
                viewport: viewport
            }).promise;


            /*
            ----------------------------------------------------
            PRÉ-PROCESSAMENTO
            ----------------------------------------------------
            */

            setProgress(
                porcentagemBase + 5,
                `Preparando imagem da página ${paginaNumero}...`
            );


            melhorarImagem(
                canvas
            );


            /*
            ----------------------------------------------------
            OCR
            ----------------------------------------------------
            */

            setStatus(
                `Executando OCR — página ${paginaNumero} de ${totalPaginas}...`,
                ""
            );


            const resultadoOCR =
                await Tesseract.recognize(
                    canvas,
                    "por",
                    {

                        logger: mensagem => {

                            if (
                                mensagem.status ===
                                "recognizing text"
                            ) {

                                const progressoOCR =
                                    (mensagem.progress || 0) * 25;


                                const progressoTotal =
                                    porcentagemBase +
                                    10 +
                                    progressoOCR;


                                setProgress(
                                    progressoTotal,
                                    `OCR página ${paginaNumero}/${totalPaginas}: ${Math.round((mensagem.progress || 0) * 100)}%`
                                );

                            }

                        }

                    }
                );


            let textoPagina =
                resultadoOCR.data.text || "";


            textoPagina =
                limparTextoOCR(
                    textoPagina
                );


            textoCompleto +=
                `\n\n===== PÁGINA ${paginaNumero} =====\n\n` +
                textoPagina;


            /*
            ----------------------------------------------------
            PROGRESSO
            ----------------------------------------------------
            */

            const fimPagina =
                (paginaNumero /
                totalPaginas) * 100;


            setProgress(
                fimPagina,
                `Página ${paginaNumero} de ${totalPaginas} concluída.`
            );
        }


        /*
        --------------------------------------------------------
        TEXTO FINAL
        --------------------------------------------------------
        */

        textoCompleto =
            limparTextoOCR(
                textoCompleto
            );


        rawText.value =
            textoCompleto;


        setProgress(
            100,
            "OCR concluído."
        );


        setStatus(
            "OCR concluído. Organizando os dados da requisição...",
            "ok"
        );


        /*
        --------------------------------------------------------
        EXTRAÇÃO
        --------------------------------------------------------
        */

        const dados =
            extrairRequisicao(
                textoCompleto
            );


        resultadoAtual =
            dados;


        renderizarResultado(
            dados
        );


        btnCopiar.disabled = false;
        btnCSV.disabled =
            dados.itens.length === 0;
        btnTexto.disabled = false;


        setStatus(
            `Leitura concluída. ${dados.itens.length} item(ns) identificado(s).`,
            "ok"
        );

    }

    catch (erro) {

        console.error(
            "Erro durante processamento:",
            erro
        );


        setStatus(
            "Erro durante a leitura: " +
            erro.message,
            "error"
        );


        resultado.innerHTML = `
            <div class="empty">
                Não foi possível processar o PDF.
                <br><br>
                Abra o console do navegador (F12)
                para ver detalhes técnicos.
            </div>
        `;

    }

    finally {

        btnLer.disabled = false;

    }

}


/*
============================================================
MELHORAR IMAGEM
============================================================

Converte para escala de cinza e aumenta o contraste.
Isso ajuda bastante em documentos digitalizados.
*/

function melhorarImagem(canvas) {

    const ctx =
        canvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );


    const imagem =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );


    const data =
        imagem.data;


    for (
        let i = 0;
        i < data.length;
        i += 4
    ) {

        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];


        /*
        Luminância aproximada
        */

        let cinza =
            0.299 * r +
            0.587 * g +
            0.114 * b;


        /*
        Aumenta contraste.
        */

        cinza =
            ((cinza - 128) * 1.35) + 128;


        cinza =
            Math.max(
                0,
                Math.min(
                    255,
                    cinza
                )
            );


        data[i] =
            cinza;

        data[i + 1] =
            cinza;

        data[i + 2] =
            cinza;
    }


    ctx.putImageData(
        imagem,
        0,
        0
    );
}


/*
============================================================
LIMPEZA DO OCR
============================================================
*/

function limparTextoOCR(texto) {

    if (!texto) {
        return "";
    }


    return texto

        .replace(/\r/g, "")

        /*
        Remove espaços excessivos.
        */

        .replace(/[ \t]+/g, " ")

        /*
        Remove muitas linhas vazias.
        */

        .replace(/\n{4,}/g, "\n\n")

        .trim();
}


/*
============================================================
 EXTRAÇÃO DA REQUISIÇÃO
============================================================
*/

function extrairRequisicao(texto) {

    const resultado = {

        requisicao: "",
        solicitante: "",
        contrato: "",
        itens: []

    };


    /*
    --------------------------------------------------------
    REQUISIÇÃO
    --------------------------------------------------------
    */

    const rqPatterns = [

        /N[ÚU]MERO\s+REQUISI[ÇC][ÃA]O\s*:?\s*(RQ[-\s]?\d+)/i,

        /REQUISI[ÇC][ÃA]O\s*:?\s*(RQ[-\s]?\d+)/i,

        /\b(RQ[-\s]?\d+)\b/i

    ];


    for (
        const pattern of rqPatterns
    ) {

        const match =
            texto.match(pattern);


        if (match) {

            resultado.requisicao =
                normalizarRQ(
                    match[1]
                );

            break;
        }

    }


    /*
    --------------------------------------------------------
    SOLICITANTE
    --------------------------------------------------------
    */

    const solicitantePatterns = [

        /SOLICITANTE\s*:?\s*([^\n]+)/i,

        /SOLICITANTE\s*\n\s*([^\n]+)/i

    ];


    for (
        const pattern
        of solicitantePatterns
    ) {

        const match =
            texto.match(
                pattern
            );


        if (match) {

            resultado.solicitante =
                limparCampo(
                    match[1]
                );

            break;
        }

    }


    /*
    --------------------------------------------------------
    CONTRATO / UNIDADE
    --------------------------------------------------------
    */

    const contratoPatterns = [

        /CONTRATO\s*\/\s*UNIDADE\s*:?\s*([^\n]+)/i,

        /CONTRATO\s*:?\s*([^\n]+)/i

    ];


    for (
        const pattern
        of contratoPatterns
    ) {

        const match =
            texto.match(
                pattern
            );


        if (match) {

            resultado.contrato =
                limparCampo(
                    match[1]
                );

            break;
        }

    }


    /*
    --------------------------------------------------------
    ITENS
    --------------------------------------------------------

    O OCR pode destruir a tabela original.
    Portanto usamos várias estratégias.
    */

    resultado.itens =
        extrairItensPorLinhas(
            texto
        );


    /*
    --------------------------------------------------------
    COLABORADORES
    --------------------------------------------------------
    */

    aplicarColaboradores(
        texto,
        resultado.itens
    );


    /*
    --------------------------------------------------------
    AGRUPAR DUPLICADOS
    --------------------------------------------------------
    */

    resultado.itens =
        agruparItens(
            resultado.itens
        );


    return resultado;
}


/*
============================================================
NORMALIZAR RQ
============================================================
*/

function normalizarRQ(valor) {

    return String(valor)
        .toUpperCase()
        .replace(/\s+/g, "")
        .replace(/^RQ(\d+)$/, "RQ-$1")
        .replace(/^RQ-(\d+)$/, "RQ-$1");
}


/*
============================================================
LIMPAR CAMPO
============================================================
*/

function limparCampo(valor) {

    return String(valor)
        .replace(/\s+/g, " ")
        .replace(/^[:\-–—\s]+/, "")
        .trim();
}


/*
============================================================
EXTRAIR ITENS
============================================================
*/

function extrairItensPorLinhas(texto) {

    const itens = [];

    const linhas =
        texto
            .split("\n")
            .map(l => l.trim())
            .filter(Boolean);


    /*
    --------------------------------------------------------
    PADRÕES POSSÍVEIS DE CÓDIGO
    --------------------------------------------------------

    Aceita códigos com:
    001234
    123456
    ABC123
    01.234
    etc.
    */

    const codigoRegex =
        /^([A-Z0-9][A-Z0-9.\-\/]{2,})\s+/i;


    for (
        let i = 0;
        i < linhas.length;
        i++
    ) {

        const linha =
            linhas[i];


        /*
        Ignorar cabeçalhos.
        */

        if (
            /C[ÓO]DIGO.*PRODUTO/i.test(linha) ||
            /DESCRI[ÇC][ÃA]O/i.test(linha) ||
            /TOTAL/i.test(linha) ||
            /SOLICITANTE/i.test(linha) ||
            /CONTRATO/i.test(linha)
        ) {

            continue;
        }


        const match =
            linha.match(
                codigoRegex
            );


        if (!match) {
            continue;
        }


        const codigo =
            match[1];


        /*
        Evitar capturar números aleatórios
        do cabeçalho/documento.
        */

        if (
            codigo.length < 3
        ) {

            continue;
        }


        const resto =
            linha
                .substring(
                    match[0].length
                )
                .trim();


        /*
        ----------------------------------------------------
        PROCURAR QUANTIDADE NO FINAL
        ----------------------------------------------------
        */

        const quantidadeMatch =
            resto.match(
                /(?:\s|\|)+(\d+(?:[,.]\d+)?)\s*$/ 
            );


        let quantidade = null;
        let nome = resto;


        if (quantidadeMatch) {

            quantidade =
                quantidadeMatch[1]
                    .replace(",", ".");


            nome =
                resto.substring(
                    0,
                    quantidadeMatch.index
                ).trim();
        }


        /*
        Outra possibilidade:
        código | produto | quantidade
        */

        const partes =
            resto
                .split(/\s*\|\s*/);


        if (
            partes.length >= 2
        ) {

            const ultima =
                partes[partes.length - 1];


            if (
                /^\d+(?:[,.]\d+)?$/.test(
                    ultima
                )
            ) {

                quantidade =
                    ultima.replace(
                        ",",
                        "."
                    );


                nome =
                    partes
                        .slice(
                            0,
                            -1
                        )
                        .join(" | ")
                        .trim();
            }

        }


        /*
        Se não encontrou quantidade,
        tenta procurar nas próximas palavras.
        */

        if (
            quantidade === null
        ) {

            const q =
                resto.match(
                    /\b(\d+)\b/
                );


            if (q) {

                quantidade =
                    q[1];

                nome =
                    resto
                        .replace(
                            q[0],
                            ""
                        )
                        .trim();
            }

        }


        if (
            !nome ||
            quantidade === null
        ) {

            continue;
        }


        /*
        Evitar linhas obviamente não relacionadas
        a produtos.
        */

        if (
            nome.length < 2
        ) {

            continue;
        }


        itens.push({

            codigo:
                codigo.trim(),

            nome:
                limparCampo(nome),

            solicitado:
                quantidade,

            colaborador: ""

        });

    }


    return itens;
}


/*
============================================================
COLABORADORES
============================================================
*/

function aplicarColaboradores(
    texto,
    itens
) {

    /*
    Procura ocorrências de:

    COLABORADOR: João
    */

    const encontrados = [];


    const regex =
        /COLABORADOR\s*:?\s*([^\n]+)/gi;


    let match;


    while (
        (match = regex.exec(texto))
        !== null
    ) {

        encontrados.push(
            limparCampo(
                match[1]
            )
        );

    }


    /*
    Se encontrou colaboradores,
    associa pela ordem dos itens.
    */

    for (
        let i = 0;
        i < itens.length &&
        i < encontrados.length;
        i++
    ) {

        itens[i].colaborador =
            encontrados[i];

    }
}


/*
============================================================
AGRUPAR DUPLICADOS
============================================================
*/

function agruparItens(itens) {

    const mapa =
        new Map();


    for (
        const item of itens
    ) {

        const chave =
            (
                item.codigo +
                "|" +
                item.nome
            ).toUpperCase();


        if (
            mapa.has(chave)
        ) {

            const existente =
                mapa.get(chave);


            const a =
                Number(
                    existente.solicitado
                ) || 0;


            const b =
                Number(
                    item.solicitado
                ) || 0;


            existente.solicitado =
                a + b;

        }

        else {

            mapa.set(
                chave,
                {
                    ...item
                }
            );

        }

    }


    return Array.from(
        mapa.values()
    );
}


/*
============================================================
RENDERIZAR RESULTADO
============================================================
*/

function renderizarResultado(
    dados
) {

    let html = `

        <div class="result-grid">

            <div class="result-box">

                <small>Requisição</small>

                <strong>
                    ${escapeHTML(
                        dados.requisicao || "-"
                    )}
                </strong>

            </div>


            <div class="result-box">

                <small>Solicitante</small>

                <strong>
                    ${escapeHTML(
                        dados.solicitante || "-"
                    )}
                </strong>

            </div>


            <div class="result-box">

                <small>Contrato / Unidade</small>

                <strong>
                    ${escapeHTML(
                        dados.contrato || "-"
                    )}
                </strong>

            </div>

        </div>

    `;


    if (
        !dados.itens.length
    ) {

        html += `

            <div class="empty">

                O OCR terminou, mas não conseguiu
                identificar os itens automaticamente.

                <br><br>

                Clique em
                <strong>Mostrar texto OCR</strong>
                para verificar o texto reconhecido.

            </div>

        `;

    }

    else {

        html += `

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>Código</th>

                            <th>Produto</th>

                            <th>Quantidade</th>

                            <th>Colaborador</th>

                        </tr>

                    </thead>

                    <tbody>

        `;


        for (
            const item of dados.itens
        ) {

            html += `

                <tr>

                    <td>
                        ${escapeHTML(
                            item.codigo
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            item.nome
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            String(
                                item.solicitado
                            )
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            item.colaborador || "-"
                        )}
                    </td>

                </tr>

            `;

        }


        html += `

                    </tbody>

                </table>

            </div>

        `;

    }


    resultado.innerHTML =
        html;
}


/*
============================================================
ESCAPE HTML
============================================================
*/

function escapeHTML(valor) {

    return String(valor)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


/*
============================================================
COPIAR
============================================================
*/

btnCopiar.addEventListener(
    "click",
    async () => {

        if (!resultadoAtual) {
            return;
        }


        let texto =

            "REQUISIÇÃO: " +
            resultadoAtual.requisicao +
            "\n" +

            "SOLICITANTE: " +
            resultadoAtual.solicitante +
            "\n" +

            "CONTRATO / UNIDADE: " +
            resultadoAtual.contrato +
            "\n\n";


        texto +=
            "CÓDIGO | PRODUTO | QUANTIDADE | COLABORADOR\n";


        for (
            const item
            of resultadoAtual.itens
        ) {

            texto +=

                item.codigo +
                " | " +

                item.nome +
                " | " +

                item.solicitado +
                " | " +

                (item.colaborador || "") +
                "\n";

        }


        try {

            await navigator.clipboard.writeText(
                texto
            );


            setStatus(
                "Resultado copiado para a área de transferência.",
                "ok"
            );

        }

        catch {

            setStatus(
                "Não foi possível copiar automaticamente.",
                "error"
            );

        }

    }
);


/*
============================================================
EXPORTAR CSV
============================================================
*/

btnCSV.addEventListener(
    "click",
    () => {

        if (
            !resultadoAtual ||
            !resultadoAtual.itens.length
        ) {

            return;
        }


        let csv =
            "Requisicao;Solicitante;Contrato;Codigo;Produto;Quantidade;Colaborador\n";


        for (
            const item
            of resultadoAtual.itens
        ) {

            csv +=

                csvCampo(
                    resultadoAtual.requisicao
                ) +

                ";" +

                csvCampo(
                    resultadoAtual.solicitante
                ) +

                ";" +

                csvCampo(
                    resultadoAtual.contrato
                ) +

                ";" +

                csvCampo(
                    item.codigo
                ) +

                ";" +

                csvCampo(
                    item.nome
                ) +

                ";" +

                csvCampo(
                    item.solicitado
                ) +

                ";" +

                csvCampo(
                    item.colaborador
                ) +

                "\n";

        }


        const blob =
            new Blob(
                ["\uFEFF" + csv],
                {
                    type:
                        "text/csv;charset=utf-8;"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const link =
            document.createElement(
                "a"
            );


        link.href =
            url;

        link.download =
            (
                resultadoAtual.requisicao ||
                "requisicao"
            ) +
            ".csv";


        link.click();


        URL.revokeObjectURL(
            url
        );

    }
);


function csvCampo(valor) {

    return '"' +
        String(
            valor ?? ""
        )
        .replace(
            /"/g,
            '""'
        ) +
        '"';
}
